# List of Jarvis projects
jarvis_projects:
  - name: "Linux Cluster Monitoring Agent"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: " Designed a Bash and PostgreSQL resource monitoring agent to automate hardware metric collection. Conducted systems analysis to align data architecture with capacity planning, validating SQL schemas and cron schedules to ensure high data integrity. Translated complex infrastructure metrics into actionable insights, bridging technical management with strategic resource optimization."

  - name: "SQL Learning & RDBMS Practice"
    git_url: "/sql"
    description: " Refined relational database skills by solving a variety of SQL queries modeled after real-world business scenarios. The primary focus was on mastering different types of JOIN operations to connect disparate datasets and better understand complex data relationships. By treating each exercise as a stakeholder request, informal questions were converted into structured technical requirements to ensure data accuracy. This approach emphasized disciplined documentation and the ability to translate technical database outputs into clear, useful insights for decision-making." 
  - name: "Python Data Analytics"
    git_url: "/python_data_anlytics"
    description: "Executed a strategic diagnostic of 1.06M retail transactions to evaluate revenue cycles, geographic concentration, and average order value fluctuations. By identifying concentration risks and the limitations of non-standardized master data, this analysis established a phased roadmap for enhancing data quality and organizational analytics maturity. Technical integrity was ensured through a rigorous validation framework in a containerized environment using Docker, PostgreSQL, and Python, effectively automating the detection of pricing outliers and transaction anomalies."
  - name: "BSA Fundamentals"
    git_url: "/bsa_fundamentals"
    description: " Structured and executed a comprehensive BSA project centered on deconstructing complex product requests into clear, actionable business objectives. By performing detailed requirements analysis, business needs were successfully separated from technical constraints, allowing high-level goals to be translated into specific functional and non-functional specifications. The project involved simulating stakeholder engagement by documenting critical assumptions and clarifications to ensure the completeness of the system's scope. This process culminated in the production of professional BRD and SRD-style documentation, demonstrating a strong ability to communicate business logic, data requirements, and intended system behavior to both technical and non-technical audiences."


  - name: "Banking Fraud Analytics & Strategic Mitigation Project"
    git_url: "/power_bi"
    description: "Directed a high-impact analysis of 13 million transactions to address a $1.47M financial exposure, serving as the strategic link between technical data patterns and business solutions. I managed the end-to-end data lifecycle, utilizing Python for comprehensive data cleaning, null-value handling, and preprocessing to ensure the integrity of a 2,000-customer behavioral model. I then developed an interactive Power BI reporting suite to transform these millions of records into actionable insights, revealing that 66% of fraudulent activity was concentrated in online channels.My analysis isolated high-intensity merchant targets where fraud rates peaked between 25% and 40%, allowing me to translate complex findings into a 6-month Strategic Roadmap. I defined the functional logic for new system controls, such as Dynamic Velocity Limits and Automated Risk Scoring, providing the framework for a recovery goal of up to $440,000. Throughout the project, I prioritized the balance between rigorous security and a frictionless user experience, ensuring that system optimizations did not disrupt the high-frequency habits of legitimate users."
  - name: "Tableau"
    git_url: "/tableau"
    description: "Developed a comprehensive HR Analytics dashboard in Tableau to visualize workforce dynamics and identify key drivers behind a 16.12% attrition rate for an organization of 1,470 employees. The project involved transforming raw HR data into interactive visualizations, including binned histograms for age distribution, donut charts for demographic segmentation, and a heat map to correlate job satisfaction levels across various organizational roles. By implementing advanced Tableau features such as calculated fields for KPI tracking and dashboard actions for dynamic filtering, the analysis pinpointed that the R&D department and employees within the 25?34 age bracket represented the highest turnover risks. These insights enable stakeholders to move beyond surface-level metrics to understand the intersection of educational background and role satisfaction, providing a data-driven foundation for targeted retention strategies."



  - name: "PySpark"
    git_url: "/spark/notebooks"
    description: "Designed and deployed four comprehensive ETL pipelines within the Databricks platform using PySpark to ingest and process data from diverse sources, including REST APIs, PostgreSQL databases (via JDBC), and internal Hive tables. Developed data manipulation logic such as three-way joins and time-series aggregations to derive business-critical metrics, while optimizing storage and query performance through the use of Parquet and Delta Lake formats. Engineered data partitioning strategies to enable efficient partition pruning, significantly reducing I/O overhead and execution time for downstream analytics. Managed real-world data engineering challenges, including handling API rate limits and ensuring schema consistency across heterogeneous data environments to deliver production-ready data assets."
  - name: "Power BI Fundamentals"
    git_url: "/power_bi"
    description: "Developed three interactive Power BI dashboards to deliver actionable insights across sales, survey, and financial data. Built a Beverages Sales Dashboard analyzing Coca-Cola?s sales and operating profit across U.S. states using AI-driven Q and A, key influencer visuals, and dynamic maps. Transformed and analyzed over 600 survey responses to create a Data Professionals Report highlighting trends in salary, job satisfaction, and in-demand skills. Designed a Stocks Dashboard by integrating Alpha Vantage API data to visualize historical prices, trading volume, key financial metrics, and earnings estimates. Performed data cleaning, transformation, and modeling, validated outputs, and translated complex data into clear, data-driven business insights."
  - name: "Blue Bank Global Asset Management Dashboard"
    git_url: "/power_bi"
    description: "Led stakeholder interviews and requirements-gathering sessions to translate business needs into a comprehensive Business Requirements Document (BRD) for an automated monthly reporting dashboard at Blue Bank Global Asset Management. Collaborated cross-functionally with development leads, data analysts, and Scrum masters to align technical architecture, data integration pipelines, and agile delivery frameworks. Delivered executive and client-facing presentations to Blue Bank stakeholders, securing project sign-off and ensuring compliance with ITGC governance and reporting standards."

